<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="fang-scan — security headers checker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.55" stop-color="#12030a"/>
      <stop offset="1" stop-color="#2b0410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#881337" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crimsonText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb3b63"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <g id="bat">
      <path d="M0 18 C-5 8 -12 2 -22 2 C-28 -8 -40 -14 -54 -10 C-47 -3 -45 4 -48 12 C-40 9 -34 13 -30 21 C-24 13 -16 11 -10 17 C-6 24 -3 27 0 34 C3 27 6 24 10 17 C16 11 24 13 30 21 C34 13 40 9 48 12 C45 4 47 -3 54 -10 C40 -14 28 -8 22 2 C12 2 5 8 0 18 Z"/>
      <path d="M-8 4 L-6 -9 L-1 1 Z"/>
      <path d="M8 4 L6 -9 L1 1 Z"/>
    </g>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- moon + bat -->
  <circle cx="1032" cy="84" r="48" fill="#ffe4e6" opacity="0.88"/>
  <circle cx="1032" cy="84" r="48" fill="none" stroke="#fb3b63" stroke-opacity="0.35" stroke-width="10"/>
  <use href="#bat" transform="translate(1032 80) scale(0.85)" fill="#12030a"/>

  <!-- giant watermark bat -->
  <use href="#bat" transform="translate(600 168) scale(4.4)" fill="#e11d48" opacity="0.13"/>

  <!-- small bats -->
  <use href="#bat" transform="translate(150 88) scale(0.9) rotate(-6)" fill="#fb3b63" opacity="0.85"/>
  <use href="#bat" transform="translate(238 140) scale(0.55) rotate(5)" fill="#e11d48" opacity="0.6"/>
  <use href="#bat" transform="translate(912 168) scale(0.5) rotate(-4)" fill="#e11d48" opacity="0.55"/>

  <!-- title -->
  <text x="600" y="212" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="2">
    <tspan fill="#ffffff">fang</tspan><tspan fill="url(#crimsonText)">-scan</tspan>
  </text>

  <!-- fangs -->
  <path d="M522 226 L540 226 L531 256 Z" fill="#ffffff"/>
  <path d="M660 226 L678 226 L669 256 Z" fill="#ffffff"/>

  <!-- tagline -->
  <text x="600" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" fill="#e7c9d1">Sink your teeth into weak security headers</text>

  <!-- pill -->
  <rect x="392" y="322" width="416" height="42" rx="21" fill="#e11d48" fill-opacity="0.14" stroke="#e11d48" stroke-opacity="0.65"/>
  <text x="600" y="349" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#fda4af">SECURITY HEADERS CHECKER</text>

  <rect x="0" y="396" width="1200" height="4" fill="#e11d48"/>
</svg>
